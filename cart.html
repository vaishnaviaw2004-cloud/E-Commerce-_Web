<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cart - E-Commerce</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #343a40;
      color: white;
      padding: 15px 40px;
    }

    .navbar h2 {
      margin: 0;
      font-size: 1.5em;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: #ffc107;
    }

    /* Cart container */
    .cart-container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    td img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }

    .total {
      text-align: right;
      font-size: 18px;
      margin-top: 20px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    .buttons button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
    }

    .buttons button:hover {
      background-color: #218838;
    }

    .buttons .back-btn {
      background-color: #6c757d;
    }

    .buttons .back-btn:hover {
      background-color: #5a6268;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #343a40;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <h2>ShopEase</h2>
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="#">My Orders</a>
      <a href="cart.html">Cart</a>
    </div>
  </nav>

  <div class="cart-container">
    <h2>🛒 My Cart</h2>
    <table id="cartTable">
      <tr>
        <th>Product</th>
        <th>Item</th>
        <th>Price</th>
      </tr>
    </table>
    <div class="total" id="totalPrice">Total: ₹0</div>

    <div class="buttons">
      <button class="back-btn" onclick="goBack()">← Continue Shopping</button>
      <button  onclick="proceedToPayment()">Proceed to Payment</button>
    </div>
  </div>

  <footer>
    <p>© 2025 Corizo Shopping | All Rights Reserved</p>
  </footer>

  <script>
    // Retrieve cart data from localStorage
    const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
    const cartTable = document.getElementById('cartTable');
    const totalPriceEl = document.getElementById('totalPrice');

    function loadCart() {
      let total = 0;
      cart.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><img src="${item.image}" alt="${item.name}"></td>
          <td>${item.name}</td>
          <td>₹${item.price}</td>
        `;
        cartTable.appendChild(row);
        total += item.price;
      });
      totalPriceEl.textContent = "Total: ₹" + total;
    }

    function proceedToPayment() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      window.location.href = "payment.html";
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    loadCart();
  </script>

</body>
</html>
